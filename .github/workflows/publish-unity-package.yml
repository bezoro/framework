name: Validate and publish Unity package

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      validation_platform:
        description: Select a targeted manual check; publishing always validates both platforms
        type: choice
        options:
          - all
          - windows
          - linux
        default: all
      publish_upm:
        description: Publish the validated main revision to the upm branch
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        # Main integration and publication always use both. Manual diagnosis can target one runner.
        os: ${{ fromJSON((github.event_name == 'workflow_dispatch' && !inputs.publish_upm && inputs.validation_platform == 'windows') && '["windows-latest"]' || (github.event_name == 'workflow_dispatch' && !inputs.publish_upm && inputs.validation_platform == 'linux') && '["ubuntu-latest"]' || '["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check publication target
        if: inputs.publish_upm && github.ref != 'refs/heads/main'
        shell: pwsh
        run: throw 'UPM publication requires running this workflow on main.'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.203

      - name: Install Stockfish for Linux integration tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fSL https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-linux-x86-64-universal.tar.gz -o "$RUNNER_TEMP/stockfish.tar.gz"
          echo "9defc0d4e55d49c65a6d042f3e571a39fcea499ade6dbe741b53b8c65e03611f  $RUNNER_TEMP/stockfish.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/stockfish"
          tar -xzf "$RUNNER_TEMP/stockfish.tar.gz" -C "$RUNNER_TEMP/stockfish"
          echo "BEZORO_STOCKFISH_PATH=$RUNNER_TEMP/stockfish/stockfish/stockfish-linux-x86-64-universal" >> "$GITHUB_ENV"

      - name: Resolve package version
        id: package-version
        shell: pwsh
        run: |
          $version = ./scripts/Get-PackageVersion.ps1
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved package version $version"

      - name: Restore
        run: dotnet restore bezoro.framework.sln

      - name: Build release binaries
        run: dotnet build bezoro.framework.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.package-version.outputs.version }} /p:PackageVersion=${{ steps.package-version.outputs.version }} /p:InformationalVersion=${{ steps.package-version.outputs.version }}

      - name: Check public API baseline
        shell: pwsh
        run: ./scripts/Export-PublicApi.ps1 -Check

      - name: Run release tests
        shell: pwsh
        run: |
          $testProjects = @(
            "tests/Bezoro.Build.Tests/Bezoro.Build.Tests.csproj",
            "tests/Bezoro.Core.Tests/Bezoro.Core.Tests.csproj",
            "tests/Bezoro.Events.Tests/Bezoro.Events.Tests.csproj",
            "tests/Bezoro.TypingSystem.Tests/Bezoro.TypingSystem.Tests.csproj",
            "tests/Bezoro.ECS.Tests/Bezoro.ECS.Tests.csproj",
            "tests/Bezoro.GameSystems.Tests/Bezoro.GameSystems.Tests.csproj",
            "tests/Bezoro.Simulation.Tests/Bezoro.Simulation.Tests.csproj",
            "tests/Bezoro.Navigation.Tests/Bezoro.Navigation.Tests.csproj",
            "tests/Bezoro.Persistence.Tests/Bezoro.Persistence.Tests.csproj",
            "tests/Bezoro.Logging.Tests/Bezoro.Logging.Tests.csproj",
            "tests/Bezoro.Chess.UCI.Protocol.Tests/Bezoro.Chess.UCI.Protocol.Tests.csproj",
            "tests/Bezoro.Chess.UCI.Tests/Bezoro.Chess.UCI.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            dotnet test $project -c Release --no-build --verbosity minimal
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

  publish-unity-package:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish_upm)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.203

      - name: Resolve package version
        id: package-version
        shell: pwsh
        run: |
          $version = ./scripts/Get-PackageVersion.ps1
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Resolved package version $version"

      - name: Build release binaries
        run: dotnet build bezoro.framework.sln -c Release /p:ContinuousIntegrationBuild=true /p:Version=${{ steps.package-version.outputs.version }} /p:PackageVersion=${{ steps.package-version.outputs.version }} /p:InformationalVersion=${{ steps.package-version.outputs.version }}

      - name: Build Unity package
        shell: pwsh
        run: ./scripts/Build-UnityPackage.ps1 -Configuration Release -OutputPath ./artifacts/unity-package -PackageVersion "${{ steps.package-version.outputs.version }}"

      - name: Publish upm branch
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: ./scripts/Publish-UnityPackageBranch.ps1 -PackagePath ./artifacts/unity-package -Branch upm
